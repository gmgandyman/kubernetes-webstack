---
- name: Join worker and storage nodes to the cluster
  hosts: workers:storage
  become: true
  tasks:
    # Must run before kubeadm join starts kubelet the first time
    - name: Configure kubelet self-registration labels/taints
      ansible.builtin.copy:
        dest: /etc/default/kubelet
        content: |
          KUBELET_EXTRA_ARGS="--node-labels=role={{node_role}} --register-with-taints=role={{node_role}}:NoSchedule"
      when: not kubelet_conf.stat.exists

    - name: Join cluster with kubeadm
      ansible.builtin.command: "{{ hostvars['k8s-control-plane']['join_command'] }} --node-name={{ inventory_hostname }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
      when: not kubelet_conf.stat.exists
