---
- name: Initialize Kubernetes control plane
  hosts: control_plane
  become: true
  tasks:
    - name: Initialize control plane with kubeadm
      ansible.builtin.command: >
        kubeadm init
        --pod-network-cidr=10.244.0.0/16
        --apiserver-advertise-address={{ ansible_host }}
      args:
        creates: /etc/kubernetes/admin.conf
      register: kubeadm_init

    - name: Apply flannel CNI manifest
      ansible.builtin.command: >
        kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
          --kubeconfig=/etc/kubernetes/admin.conf
      when: kubeadm_init.changed

    # reject/select take a test name, and extract is a filter, not a test - so build the
    # list by looping instead. check-joined.yml registers kubelet_conf on every
    # worker/storage host, so the lookup is always defined here.
    # Seeded empty first, otherwise an all-joined cluster skips every iteration and
    # leaves the fact undefined for the length check below.
    - name: Start with no worker/storage hosts needing a join
      ansible.builtin.set_fact:
        unjoined_hosts: []

    - name: Build list of worker/storage hosts that need joining to control plane
      ansible.builtin.set_fact:
        unjoined_hosts: "{{ unjoined_hosts + [item] }}"
      loop: "{{ groups['workers'] + groups['storage'] }}"
      when: not hostvars[item].kubelet_conf.stat.exists

    # The when statement here only runs this if unjoined_hosts from above has one or more hosts
    - name: Generate kubeadm join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: kubeadm_join_command
      when: kubeadm_init.changed or (unjoined_hosts | length > 0)

    - name: Save join command as a fact for other hosts
      ansible.builtin.set_fact:
        join_command: "{{ kubeadm_join_command.stdout }}"
      when: kubeadm_init.changed or (unjoined_hosts | length > 0)
