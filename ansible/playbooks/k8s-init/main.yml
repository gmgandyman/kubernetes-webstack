---
# /etc/kubernetes/kubelet.conf is only created after a host has been joined to a control plane
# If that file exists, we want to indicate that the worker or storage node will be skipped in the join phase
- name: Check which worker/storage nodes already joined
  hosts: workers:storage
  become: true
  tasks:
    - name: Check for existing kubelet.conf
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

- name: Initialize Kubernetes control plane
  hosts: control_plane
  become: true
  tasks:
    - name: Initialize control plane with kubeadm
      ansible.builtin.command: >
        kubeadm init
        --pod-network-cidr=10.244.0.0/16
        --apiserver-advertise-address={{ ansible_host }}
      args:
        creates: /etc/kubernetes/admin.conf
      register: kubeadm_init

    - name: Apply flannel CNI manifest
      ansible.builtin.command: >
        kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
          --kubeconfig=/etc/kubernetes/admin.conf
      when: kubeadm_init.changed

    # Step 1: create a unified list of all worker and storage nodes
    # Step 2: jinja reject will yank out any entry where hostvars[host].kubelet_conf.stat.exists = true
    # Step 3: Force a Jinja resulting lazy generator into an actual list object, because we need that
    - name: Build list of worker/storage hosts that need joining to control plane
      ansible.builtin.set_fact:
        unjoined_hosts: "{{ (groups['workers'] + groups['storage']) | reject('extract', hostvars, ['kubelet_conf', 'stat', 'exists']) | list }}"

    # The when statement here only runs this if unjoined_hosts from above has one or more hosts
    - name: Generate kubeadm join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: kubeadm_join_command
      when: kubeadm_init.changed or (unjoined_hosts | length > 0)

    - name: Save join command as a fact for other hosts
      ansible.builtin.set_fact:
        join_command: "{{ kubeadm_join_command.stdout }}"
      when: kubeadm_init.changed or (unjoined_hosts | length > 0)

- name: Join worker and storage nodes to the cluster
  hosts: workers:storage
  become: true
  tasks:
    # Must run before kubeadm join starts kubelet the first time
    - name: Configure kubelet self-registration labels/taints
      ansible.builtin.copy:
        dest: /etc/default/kubelet
        content: |
          KUBELET_EXTRA_ARGS="--node-labels=role={{node_role}} --register-with-taints=role={{node_role}}:NoSchedule"
      when: not kubelet_conf.stat.exists

    - name: Join cluster with kubeadm
      ansible.builtin.command: "{{ hostvars['k8s-control-plane']['join_command'] }} --node-name={{ inventory_hostname }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
      when: not kubelet_conf.stat.exists

- name: Fetch admin.conf to the toolbox
  hosts: control_plane
  become: true
  tasks:
    - name: Fetch admin.conf
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: /work/.kube/config
        flat: true

